[metadata]
name = foambryo
version = 0.5.1
author = Turlier lab
author_email = virtualembryo@gmail.com
description = Tension inference for 3D cell assemblies
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/VirtualEmbryo/foambryo
project_urls =
    Team website = https://www.turlierlab.com/
classifiers =
    Programming Language :: Python :: 3
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Intended Audience :: Science/Research
license_expression = GPL-3.0-or-later
license_files = License
[options]
include_package_data = True
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires = delaunay-watershed-3d>=0.5.0
                   networkx>=2.5.1
                   numpy>=1.21.6
                   scipy>=1.4.1
                   trimesh>=3.8.12

[options.extras_require]
viewing = polyscope>=1.2.0
          matplotlib>=3.3.1
# torch is only needed for the autodiff gradient-check (foambryo._autodiff_derivatives),
# which cross-checks the closed-form derivatives the variational solve uses. Not a runtime
# dependency. Install with `pip install foambryo[autodiff]` to run that check.
autodiff = torch>=2.2.0
# For the figure scripts under foambryo_benchmarks/figures/ and dw3d's
# dw3d_benchmarks.mesh_quality_comparison figure scripts, so plotting a benchmark does not
# require the Polyscope viewer (`viewing`).
benchmarks = matplotlib>=3.3.1

[options.packages.find]
where = src
