[metadata]
name = foambryo
version = 0.8.0rc1
author = Turlier lab
author_email = virtualembryo@gmail.com
description = Tension inference for 3D cell assemblies
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/VirtualEmbryo/foambryo
project_urls =
    Source = https://github.com/VirtualEmbryo/foambryo
    Documentation = https://github.com/VirtualEmbryo/foambryo/blob/v0.7.0/docs/index.md
    Changelog = https://github.com/VirtualEmbryo/foambryo/blob/v0.7.0/CHANGELOG.md
    Issues = https://github.com/VirtualEmbryo/foambryo/issues
    Team website = https://www.turlierlab.com/
classifiers =
    Programming Language :: Python :: 3
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Intended Audience :: Science/Research
license_expression = GPL-3.0-or-later
license_files = License
[options]
include_package_data = True
package_dir =
    = src
packages = find:
python_requires = >=3.12
# delaunay-watershed (since 0.8.0) is a metapackage that installs delaunay-watershed-3d (dw3d) and delaunay-watershed-2d
# (dw2d) at its own version. Its floor is the
# release foambryo's suite was run with; every foambryo release sets it (and the CI floor pin,
# .github/workflows/test-suites.yml) to the release it ships with. Until delaunay-watershed 0.8.0 is on PyPI the
# floor is its development version, which the CI installs from its development repository at a pinned commit
# (pip does not accept 0.8.0.dev0 for >=0.8.0); at the release it becomes delaunay-watershed>=0.8.0.
install_requires = delaunay-watershed>=0.8.0rc1
                   networkx>=3.2
                   numpy>=2.0.0
                   scipy>=1.13.0
                   trimesh>=4.0.0

[options.extras_require]
viewing = polyscope>=2.6.1
          matplotlib>=3.8.4
# For the figure scripts under foambryo_benchmarks/figures/ and dw3d's
# dw3d_benchmarks.mesh_quality_comparison figure scripts, so plotting a benchmark does not
# require the Polyscope viewer (`viewing`).
benchmarks = matplotlib>=3.8.4
# For `foambryo mesh` to read TIFF masks; .npy and .npz masks need nothing more.
cli = tifffile>=2023.1.23

[options.entry_points]
console_scripts =
    foambryo = foambryo.cli:main

[options.packages.find]
where = src
