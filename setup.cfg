[metadata]
name = foambryo
version = 0.7.0
author = Turlier lab
author_email = virtualembryo@gmail.com
description = Tension inference for 3D cell assemblies
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/VirtualEmbryo/foambryo
project_urls =
    Source = https://github.com/VirtualEmbryo/foambryo
    Documentation = https://github.com/VirtualEmbryo/foambryo/blob/v0.7.0/docs/index.md
    Changelog = https://github.com/VirtualEmbryo/foambryo/blob/v0.7.0/CHANGELOG.md
    Issues = https://github.com/VirtualEmbryo/foambryo/issues
    Team website = https://www.turlierlab.com/
classifiers =
    Programming Language :: Python :: 3
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Intended Audience :: Science/Research
license_expression = GPL-3.0-or-later
license_files = License
[options]
include_package_data = True
package_dir =
    = src
packages = find:
python_requires = >=3.11
install_requires = delaunay-watershed-3d>=0.7.0
                   networkx>=3.2
                   numpy>=2.0.0
                   scipy>=1.13.0
                   trimesh>=4.0.0

[options.extras_require]
viewing = polyscope>=2.6.1
          matplotlib>=3.8.4
# torch is only needed for the autodiff gradient-check (foambryo._autodiff_derivatives),
# which cross-checks the closed-form derivatives the variational solve uses. Not a runtime
# dependency. Install with `pip install foambryo[autodiff]` to run that check.
autodiff = torch>=2.3.0
# For the figure scripts under foambryo_benchmarks/figures/ and dw3d's
# dw3d_benchmarks.mesh_quality_comparison figure scripts, so plotting a benchmark does not
# require the Polyscope viewer (`viewing`).
benchmarks = matplotlib>=3.8.4
# For `foambryo mesh` to read TIFF masks; .npy and .npz masks need nothing more.
cli = tifffile>=2023.1.23

[options.entry_points]
console_scripts =
    foambryo = foambryo.cli:main

[options.packages.find]
where = src
